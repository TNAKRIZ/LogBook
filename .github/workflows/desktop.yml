# Builds LogBook Desktop on real Windows and Mac machines.
# Runs by itself whenever the web page or the desktop code changes on main (or by hand from the Actions tab),
# and puts the newest Windows / Mac zips on the Releases page under "LogBook Desktop (ล่าสุด)".
name: Build LogBook Desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'desktop/**', '.github/workflows/desktop.yml']
concurrency:
  group: desktop-build
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, platform: win32,  arch: x64,   zip: LogBook-Desktop-Windows.zip}
          - {os: macos-latest,   platform: darwin, arch: arm64, zip: LogBook-Desktop-Mac-AppleSilicon.zip}
          - {os: macos-latest,   platform: darwin, arch: x64,   zip: LogBook-Desktop-Mac-Intel.zip}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node build.js ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Zip (Windows)
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          Copy-Item "README-อ่านก่อน.txt" "dist/LogBook Desktop-win32-x64/"
          Compress-Archive -Path "dist/LogBook Desktop-win32-x64/*" -DestinationPath "${{ matrix.zip }}"
      - name: Sign ad-hoc and zip (Mac)
        if: matrix.platform == 'darwin'
        run: |
          APP="dist/LogBook Desktop-darwin-${{ matrix.arch }}/LogBook Desktop.app"
          codesign --force --deep --sign - "$APP"
          mkdir pack && cp -R "$APP" pack/ && cp "README-อ่านก่อน.txt" pack/
          (cd pack && ditto -c -k --sequesterRsrc . "../${{ matrix.zip }}")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: desktop/${{ matrix.zip }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          target_commitish: ${{ github.sha }}
          name: LogBook Desktop (ล่าสุด)
          body: |
            โปรแกรม LogBook Desktop รุ่นล่าสุด — สร้างอัตโนมัติจาก commit ${{ github.sha }}
            • Windows: LogBook-Desktop-Windows.zip
            • Mac ชิป M1/M2/M3/M4: LogBook-Desktop-Mac-AppleSilicon.zip
            • Mac Intel: LogBook-Desktop-Mac-Intel.zip
            วิธีเปิดครั้งแรกอยู่ในไฟล์ README-อ่านก่อน.txt ใน zip
          make_latest: true
          overwrite_files: true
          files: desktop/${{ matrix.zip }}
