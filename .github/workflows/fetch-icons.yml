name: Fetch item icons

# Downloads the real in-game icon for every ID in assets/icon-ids.txt
# from MeowDB (credited in README) into assets/icons/<id>.png and commits them.
on:
  push:
    branches: [main]
    paths: ['assets/icon-ids.txt', '.github/workflows/fetch-icons.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download missing icons
        run: |
          mkdir -p assets/icons assets/_probe
          ok=0; miss=0
          for id in $(grep -E '^[0-9]+$' assets/icon-ids.txt); do
            f="assets/icons/$id.png"
            [ -s "$f" ] && continue
            if curl -fsSL -A "LogBook-icon-fetch (github.com/TNAKRIZ/LogBook)" -o "$f.tmp" "https://meowdb.com/msclassic/api/assets/icons/$id" \
               && file "$f.tmp" | grep -qiE 'PNG|GIF|WebP|image'; then
              mv "$f.tmp" "$f"; ok=$((ok+1))
            else
              rm -f "$f.tmp"; echo "$id" >> assets/icons/_missing.txt; miss=$((miss+1))
            fi
            sleep 0.3
          done
          echo "downloaded=$ok missing=$miss"
          file assets/icons/* | head -5
      - name: Item data from MeowDB (shop list + item summaries)
        run: |
          mkdir -p assets/meowdb
          UA="LogBook-data-fetch (github.com/TNAKRIZ/LogBook)"
          curl -fsSL -A "$UA" -o /tmp/shops.html "https://meowdb.com/msclassic/npc-shops" || true
          # gameId -> meowdb item page id, from the shop page links
          python3 - <<'PY'
          import re, json, os
          s = open('/tmp/shops.html', encoding='utf-8', errors='ignore').read() if os.path.exists('/tmp/shops.html') else ''
          pairs = {}
          for m in re.finditer(r'/msclassic/item-db/(\d+)', s):
              seg = s[max(0, m.start()-1500): m.start()+1500]
              ic = re.findall(r'/api/assets/icons/(\d+)', seg)
              if ic:
                  # nearest icon to the link
                  best = min(re.finditer(r'/api/assets/icons/(\d+)', seg), key=lambda x: abs(x.start()-1500))
                  pairs.setdefault(best.group(1), m.group(1))
          json.dump(pairs, open('assets/meowdb/shop-item-pages.json', 'w'), indent=1, sort_keys=True)
          print(len(pairs), 'items linked from shop page')
          PY
          cp /tmp/shops.html assets/meowdb/npc-shops.html 2>/dev/null || true
          # one-line summaries ("Where to get ... Level Required ..., Weapon Attack +15.") per item page
          python3 - <<'PY'
          import json, re, subprocess, time, html
          pairs = json.load(open('assets/meowdb/shop-item-pages.json'))
          ids = [l.strip() for l in open('assets/icon-ids.txt') if l.strip().isdigit()]
          out = {}
          for gid in ids:
              mid = pairs.get(gid)
              if not mid: continue
              r = subprocess.run(['curl', '-fsSL', '-A', 'LogBook-data-fetch', f'https://meowdb.com/msclassic/item-db/{mid}'], capture_output=True, text=True)
              m = re.search(r'<meta name="description" content="([^"]*)"', r.stdout)
              t = re.search(r'<title>([^<]*)</title>', r.stdout)
              out[gid] = {'page': mid, 'title': html.unescape(t.group(1)) if t else '', 'desc': html.unescape(m.group(1)) if m else ''}
              time.sleep(0.3)
          json.dump(out, open('assets/meowdb/item-summaries.json', 'w'), indent=1, ensure_ascii=False, sort_keys=True)
          print(len(out), 'summaries')
          PY
          rm -rf assets/_probe
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Fetch item icons from MeowDB"
          git push
