<!doctype html><html lang="th"><head><meta charset="utf-8"><title>LogBook · สด</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:transparent;overflow:hidden}
body{font:14px/1.3 "Noto Sans Thai","Leelawadee UI",Tahoma,system-ui,sans-serif;color:#3a2817;-webkit-app-region:drag;user-select:none}
.wrap{position:absolute;inset:0;border-radius:14px;background:rgba(255,246,230,var(--a,.55));border:2px solid rgba(217,102,26,calc(var(--a,.55) + .25));display:flex;flex-direction:column;padding:8px 10px;gap:7px}
.t{text-shadow:0 0 3px #fff8ec,0 0 3px #fff8ec,0 0 6px #fff8ec}
.hd{display:flex;align-items:center;justify-content:center;gap:8px;padding-bottom:4px}
.hd .bk{height:34px;transform:rotate(-4deg);filter:drop-shadow(0 2px 1px rgba(0,0,0,.3))}.hd .wm{height:44px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1}
.c{background:rgba(255,253,248,calc(var(--a,.55)*.9));border:2px solid rgba(236,216,184,calc(var(--a,.55) + .2));border-radius:10px;padding:5px 8px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.c span{font-size:11.5px;color:#6a5038;font-weight:700;white-space:nowrap}
.c b{font-size:clamp(17px,8vw,30px);font-weight:800;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c i{font-style:normal;font-size:11px;color:#6a5038}
.exp b{color:#22702d}.meso b{color:#9a6800}.eta b{color:#b84a10}
.ft{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:#4a3524}
.clock{font:700 15px ui-monospace,Consolas,monospace;letter-spacing:.5px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:#999;vertical-align:1px}.dot.on{background:#3fae4f;box-shadow:0 0 0 3px rgba(63,174,79,.3)}
.bar{display:none;align-items:center;gap:10px;height:100%;white-space:nowrap;overflow:hidden;font-weight:700;font-size:clamp(12px,3.2vw,17px);padding-right:6px}
.bar img{height:28px}.bar .v{font-weight:800}.bar .sep{color:#b8946a}.bar .e{color:#22702d}.bar .m{color:#9a6800}.bar .tt{color:#b84a10}
body.compact .wrap{padding:4px 10px;justify-content:center}body.compact .hd,body.compact .g,body.compact .ft{display:none}body.compact .bar{display:flex}
.ctl{position:absolute;top:4px;right:6px;display:flex;gap:4px;align-items:center;opacity:0;transition:opacity .15s;-webkit-app-region:no-drag;background:rgba(20,28,60,.92);border-radius:8px;padding:3px 5px;z-index:3}
body:hover .ctl{opacity:1}body.ct .ctl{display:none}
.ctl button{border:none;background:transparent;color:#fff;font:700 12px system-ui;cursor:pointer;padding:2px 5px;border-radius:5px}.ctl button:hover{background:rgba(255,255,255,.18)}
.ctl input{width:70px;accent-color:#f5c21b}
.ctl label{color:#cfd6f5;font:600 10px system-ui}
.ctn{display:none;position:absolute;left:8px;bottom:3px;font:700 10px system-ui;color:#fff;background:rgba(20,28,60,.75);border-radius:5px;padding:1px 6px;z-index:3}
body.ct .ctn{display:block}body.compact .ctn{bottom:auto;top:2px;left:auto;right:6px}
.warn{color:#bf3324}
</style></head>
<body>
<div class="wrap">
  <div class="hd"><img class="bk" id="bk" alt=""><img class="wm" id="wm" alt="LogBook"></div>
  <div class="g t" id="g"></div>
  <div class="ft t" id="ft"></div>
  <div class="bar t" id="bar"></div>
</div>
<div class="ctl">
  <label>ความใส</label><input type="range" id="bg" min="0" max="100" title="ความทึบของพื้นหลัง">
  <button id="md" title="สลับแบบเต็ม / แถบเล็ก"></button>
  <button id="ck" title="คลิกทะลุ (กด Ctrl+Shift+L อีกครั้งเพื่อปิด)">👆</button>
  <button id="x" title="ปิดหน้าต่างลอย">✕</button>
</div>
<div class="ctn">👆 คลิกทะลุอยู่ · Ctrl+Shift+L เพื่อปิด</div>
<script>
let mode='full',last=null;
const $=id=>document.getElementById(id);
function setBg(v){document.body.style.setProperty('--a',v);}
function applyMode(){document.body.classList.toggle('compact',mode==='compact');$('md').textContent=mode==='compact'?'▣':'▬';draw();}
function draw(){
  const s=last||{expHr:'–',pctHr:'–',eta:'–',mesoHr:null,clock:'0:00:00',on:false,farming:false};
  const cell=(c,k,v,sub)=>`<div class="c ${c}"><span>${k}</span><b>${v}</b>${sub?`<i>${sub}</i>`:''}</div>`;
  const nt=t=>t?`<span class="${t.startsWith('⚠')?'warn':''}">${t}</span>`:'';
  $('g').innerHTML=cell('exp','EXP/ชม.',s.expHr,nt(s.expNote))+cell('','%/ชม.',s.pctHr,s.pct!=null?`ตอนนี้ ${s.pct}%`:'')+cell('eta','อัปเลเวลในอีก',s.eta)+cell('meso','Meso/ชม.',s.mesoHr??'–',nt(s.mesoNote));
  $('ft').innerHTML=`<span><span class="dot ${s.on?'on':''}"></span>${s.on?'กำลังอ่านจอ':'ยังไม่ได้เปิดอ่าน'}${s.warn?' <span class="warn">⚠ อ่านไม่ได้</span>':''}</span><span>⏱ ${s.farming?'ฟาร์มไป':'อ่านมา'} <span class="clock">${s.clock}</span></span>`;
  const sep='<span class="sep">·</span>';
  $('bar').innerHTML=`<img alt="" src="${$('bk').src}"><span class="dot ${s.on?'on':''}"></span><span>EXP <span class="v e">${s.expHr}</span>/ชม.</span>${sep}<span><span class="v">${s.pctHr}</span>/ชม.</span>${sep}<span>อัปอีก <span class="v tt">${s.eta}</span></span>`+
    (s.mesoHr!=null?`${sep}<span>Meso <span class="v m">${s.mesoHr}</span>/ชม.</span>`:'')+`${sep}<span>⏱ <span class="clock">${s.clock}</span></span>${s.warn?' <span class="warn">⚠</span>':''}`;
}
ov.onInit(d=>{mode=d.mode;if(d.logos){$('bk').src=d.logos.book;$('wm').src=d.logos.word;}setBg(d.bg);$('bg').value=Math.round(d.bg*100);document.body.classList.toggle('ct',!!d.clickThrough);applyMode();});
ov.onStats(s=>{last=s;draw();});
ov.onClick(on=>document.body.classList.toggle('ct',on));
$('bg').oninput=e=>{const v=e.target.value/100;setBg(v);ov.setBg(v);};
$('md').onclick=()=>ov.setMode(mode==='compact'?'full':'compact');
$('ck').onclick=()=>ov.toggleClick();$('x').onclick=()=>ov.close();
draw();
</script>
</body></html>
